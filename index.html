<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alvin 的赎罪计划</title>
<style>
:root{--bg:#fff4f1;--card:#ffffff;--ink:#3b2a2a;--muted:#8a6f6f;--accent:#ff6b81;--accent-ink:#ffffff;--stage:#ffe3dc;--line:#f3cfc8;--bubble:#ffffff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1517;--card:#2a1d20;--ink:#f6e9e7;--muted:#c3a5a5;--accent:#ff7f93;--accent-ink:#2a1216;--stage:#3a262b;--line:#4a3036;--bubble:#4a3036;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1517;--card:#2a1d20;--ink:#f6e9e7;--muted:#c3a5a5;--accent:#ff7f93;--accent-ink:#2a1216;--stage:#3a262b;--line:#4a3036;--bubble:#4a3036;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;display:flex;justify-content:center;padding:20px 14px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 18px;text-align:center}
h1{font-size:24px;margin:0 0 6px}
p.sub{color:var(--muted);margin:0 0 18px;font-size:14px;line-height:1.6}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 28px;font-size:17px;cursor:pointer}
button:active{transform:scale(.96)}
.hidden{display:none!important}
.big{font-size:84px;line-height:1;margin:6px 0 14px}
.rules{list-style:none;padding:0;margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.9}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.hearts{font-size:22px;letter-spacing:3px;color:var(--accent)}
.stage{position:relative;background:var(--stage);border-radius:20px;height:340px;overflow:hidden;cursor:none;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage svg.bf{position:absolute;left:50%;bottom:0;width:240px;height:280px;transform:translateX(-50%)}
#face{transform-box:fill-box;transform-origin:50% 100%}
.ouch #face{animation:shake .42s}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg) translateY(6px)}45%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}}
.eyes-h,.mouth-h,.sweat{display:none}
.ouch .eyes-h,.ouch .mouth-h,.ouch .sweat{display:inline}
.ouch .eyes-n,.ouch .mouth-n{display:none}
.bump{display:none}
.bump.on{display:inline}
.bubble{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--bubble);border-radius:14px;padding:8px 14px;font-size:15px;font-weight:700;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.hammer{position:absolute;width:60px;height:110px;pointer-events:none;opacity:0;transform-origin:30px 100px;transform:rotate(-25deg);left:0;top:0}
.hammer.swing{animation:swing .22s ease-out}
@keyframes swing{0%{transform:rotate(-25deg)}45%{transform:rotate(38deg) scale(1.08)}100%{transform:rotate(-25deg)}}
.pop{position:absolute;pointer-events:none;font-weight:800;color:var(--accent);font-size:22px;animation:rise .8s ease-out forwards}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
.prize{margin-top:16px}
.slot{font-size:76px;line-height:1;margin:6px 0 8px}
.gift-name{font-size:20px;font-weight:800;margin:0 0 4px}
.gift-msg{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.6}
.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent);padding:10px 24px;font-size:15px}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}
.mail-status{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,107,129,.08);border:1px solid rgba(255,107,129,.25);color:var(--muted);font-size:13px;line-height:1.5}
.mail-status.success{background:rgba(39,174,96,.08);border-color:rgba(39,174,96,.3);color:#1a7a4d}
.mail-status.error{background:rgba(192,57,43,.08);border-color:rgba(192,57,43,.25);color:#9c2d2d}
.stage{height:auto!important;aspect-ratio:3/4;max-width:380px;margin:0 auto}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.photo.shake{animation:pshake .42s}
@keyframes pshake{0%,100%{transform:translate(0) rotate(0) scale(1)}20%{transform:translate(-6px,6px) rotate(-1.5deg) scale(1.03)}45%{transform:translate(6px,0) rotate(1.2deg) scale(1.03)}70%{transform:translate(-3px,0) scale(1.02)}}
.headzone{position:absolute;left:14%;top:30%;width:72%;height:60%}
.cover-art{width:100%;max-width:360px;margin:0 auto 10px;border-radius:22px;overflow:hidden;background:#f3f3f3;box-shadow:0 12px 28px rgba(80,48,54,.12)}
.cover-art svg{display:block;width:100%;height:auto;vertical-align:top}
.real-cover{display:block;width:100%;height:auto;object-fit:cover;border-radius:22px}
.note-reveal{margin-top:18px;display:grid;gap:16px}
.note-paper{position:relative;background:#f3f0eb;border:1px solid rgba(84,68,63,.2);border-radius:16px;overflow:hidden;box-shadow:0 20px 28px rgba(58,43,42,.08);transform-origin:left center}
.note-paper.is-flipping{animation:pageFlip .9s cubic-bezier(.22,1,.36,1)}
@keyframes pageFlip{0%{transform:perspective(1300px) rotateY(90deg);opacity:0.2}45%{opacity:1}100%{transform:perspective(1300px) rotateY(0deg);opacity:1}}
.real-photo-wrap{background:#f5f5f5;display:flex;align-items:center;justify-content:center;padding:0}
.real-photo{display:block;width:100%;height:auto;max-height:560px;object-fit:contain;background:#f6f6f6}
.mixue-card{background:#f3f0eb;border:1px solid rgba(84,68,63,.2);border-radius:18px;padding:12px;box-shadow:0 18px 24px rgba(58,43,42,.08);display:flex;align-items:center;justify-content:center;min-height:260px}
.mixue-real{display:block;width:100%;max-width:320px;height:auto;object-fit:contain;filter:drop-shadow(0 18px 20px rgba(0,0,0,.22))}
.mixue-name{display:block;margin-top:8px;font-size:16px;font-weight:800;letter-spacing:1px;color:#3c2a2a;text-align:center}
.delivery-note{margin-top:10px;color:var(--muted);font-size:13px;line-height:1.6;text-align:center}
</style>
</head>
<body>
<main class="card">

  <section id="start">
    <div class="cover-art" aria-label="Alvin 的赎罪计划封面">
      <img class="real-cover" src="游戏封面.jpg" alt="Alvin 的赎罪计划封面" />
    </div>
    <h1>Alvin 的赎罪计划</h1>
    <p class="sub">Alvin 惹你生气了？那就来赎罪吧～</p>
    <ul class="rules">
      <li>🔨 点击开始，用木锤子敲 Alvin 的头</li>
      <li>⭐ 每敲一下得 1 分</li>
      <li>🎁 集齐 3 分，抽一份神秘小礼物</li>
    </ul>
    <button id="startBtn">开始游戏</button>
  </section>

  <section id="game" class="hidden">
    <div class="hud"><span>消气进度</span><span class="hearts" id="hearts"></span></div>
    <div class="stage" id="stage">
      <div class="bubble" id="bubble">我错了……快打我吧！</div>
      <img class="photo" id="pic" alt="Alvin">
      <div id="head" class="headzone"></div>
      <svg class="hammer" id="hammer" viewBox="0 0 60 110">
        <rect x="26" y="30" width="8" height="78" rx="4" fill="#b7792f"/>
        <rect x="4" y="4" width="52" height="34" rx="9" fill="#8a5a24"/>
        <rect x="10" y="4" width="6" height="34" fill="#6f4519"/>
        <rect x="44" y="4" width="6" height="34" fill="#6f4519"/>
      </svg>
    </div>
    <p class="hint" id="hint">点 Alvin 的头来敲打！</p>

    <div class="prize hidden" id="prize">
      <div class="slot" id="slot">🎁</div>
      <p class="gift-name" id="giftName">3 分达成！</p>
      <p class="gift-msg" id="giftMsg">气消了一点点了吗？来抽个神秘小礼物吧～</p>
      <button id="drawBtn">🎁 抽取神秘小礼物</button>
      <div class="note-reveal hidden" id="noteReveal">
        <div class="note-paper real-photo-wrap" id="notePaper">
          <img class="real-photo" src="手写道歉信.jpg" alt="手写道歉信" />
        </div>
        <div class="mixue-card">
          <img class="mixue-real" src="Mixue 奶茶.jpg" alt="MIXUE Brown Sugar Bubble Tea" />
        </div>
        <div class="delivery-note">奶茶将会在午餐或晚餐时间由foodpanda送达K35</div>
      </div>
      <div id="mailStatus" class="mail-status hidden" aria-live="polite">正在通知 Alvin…</div>
    </div>
  </section>

</main>

  var gifts=[

  ];

  function renderHearts(){
    var s='';
    for(var i=0;i<GOAL;i++) s+= i<score?'♥':'♡';
    $('hearts').textContent=s;
    var bs=document.querySelectorAll('#bumps .bump');
    for(var j=0;j<bs.length;j++) bs[j].classList.toggle('on', j<score);
  }

  function moveHammer(e){
    var r=stage.getBoundingClientRect();
    hammer.style.left=(e.clientX-r.left-30)+'px';
    hammer.style.top=(e.clientY-r.top-21)+'px';
    hammer.style.opacity=1;
  }
  function swing(){
    hammer.classList.remove('swing'); void hammer.offsetWidth; hammer.classList.add('swing');
  }
  function pop(e,text){
    var r=stage.getBoundingClientRect();
    var s=document.createElement('span');
    s.className='pop'; s.textContent=text;
    s.style.left=(e.clientX-r.left)+'px'; s.style.top=(e.clientY-r.top-30)+'px';
    stage.appendChild(s);
    setTimeout(function(){s.remove()},850);
  }

  stage.addEventListener('pointermove',function(e){ if(!locked) moveHammer(e); });
  stage.addEventListener('pointerdown',function(e){
    if(locked) return;
    moveHammer(e); swing();
    if(!e.target.closest('#head')) return;
    score++; renderHearts();
    pop(e,'+1');
    bubble.textContent=lines[Math.floor(Math.random()*lines.length)];
    pic.src=PICS[PHOTO_BY_HIT[Math.min(score,3)]];
    pic.classList.remove('shake'); void pic.offsetWidth; pic.classList.add('shake');
    if(score>=GOAL){
      locked=true; hammer.style.opacity=0;
      setTimeout(function(){
        bubble.textContent='打够了吗……消气了没？';
        $('hint').classList.add('hidden');
        $('prize').classList.remove('hidden');
      },650);
    }
  });

  $('startBtn').onclick=function(){
    $('start').classList.add('hidden'); $('game').classList.remove('hidden'); renderHearts();
  };

  $('drawBtn').onclick=function(){
    var btn=$('drawBtn'); btn.classList.add('hidden');
    $('giftName').textContent='抽取中……'; $('giftMsg').textContent='神秘小礼物是什么呢？';
    var status=$('mailStatus');
    status.classList.remove('success','error');
    status.classList.add('hidden');
    var t=setInterval(function(){ $('slot').textContent=gifts[Math.floor(Math.random()*gifts.length)].e; },90);
    setTimeout(function(){
      clearInterval(t);
      var g=gifts[Math.floor(Math.random()*gifts.length)];
      $('slot').textContent=g.e; $('giftName').textContent='🎉 抽中：'+g.n; $('giftMsg').textContent=g.m;
      $('noteReveal').classList.remove('hidden');
      var notePaper=$('notePaper');
      notePaper.classList.remove('is-flipping');
      void notePaper.offsetWidth;
      notePaper.classList.add('is-flipping');

      var payload={
        subject:'Alvin 的赎罪计划：抽中礼物通知',
        to_email:'alvinteo246810@gmail.com',
        body:'Alvin：yithian 在赎罪计划中抽中了「'+g.n+'」。\n\n这是一份真诚的道歉，也是一份真实的兑现承诺。',
        html:'<p>Alvin：yithian 在赎罪计划中抽中了 <strong>'+g.n+'</strong>。</p><p>这是一份真诚的道歉，也是一份真实的兑现承诺。</p>'
      };

      status.textContent='正在通过后端发送通知到 Alvin 邮箱…';
      status.classList.remove('hidden');

      fetch('/api/send-email', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      }).then(function(r){
        return r.json().then(function(data){
          if(!r.ok || !data.ok){
            throw new Error(data.error || '邮件发送失败');
          }
          return data;
        });
      }).then(function(){
        status.textContent='✅ 已通知 Alvin，等待兑现。';
        status.classList.add('success');
        status.classList.remove('error');
      }).catch(function(err){
        status.textContent='⚠️ 后端未配置 SMTP，暂时无法发送邮件：'+(err && err.message ? err.message : '未知错误');
        status.classList.add('error');
        status.classList.remove('success');
      });
    },1700);
  };
